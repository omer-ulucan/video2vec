# Every third-party file the build and CI download, pinned by URL and SHA-256.
# Readers: scripts/deps/lock.sh (shell) and cmake/DepsLock.cmake (FetchContent);
# nothing is downloaded without being checked against this file first.
#
# Format: one entry per line, whitespace-separated:
#     <name> <version> <sha256> <url>
#
# To change a pin, update version, URL and hash together in one commit. Hashes
# come from the publisher where it publishes one (GitHub release asset digest,
# Hugging Face LFS object id); otherwise from the first download, which the
# deps-lock CI job re-checks for every entry on every run.

