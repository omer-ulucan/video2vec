name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # Licensing gate: every file must declare its copyright and license
  # (SPDX headers, or REUSE.toml for files that cannot hold comments).
  reuse:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing below pushes
      - name: REUSE compliance
        # The reuse image pinned by digest (tag 6.2.0): reuse-action builds from
        # the floating tag fsfe/reuse:6, which can change under the same pin.
        env:
          REUSE_DIGEST: sha256:85462a75c0f8efda09ddd190b92816b70e7662577c8427429e11e1b9f25a992e
        run: |
          docker run --rm --volume "$PWD:/data" --workdir /data --entrypoint sh \
            "fsfe/reuse:6.2.0@${REUSE_DIGEST}" \
            -c 'git config --global --add safe.directory /data && reuse lint'

  # Documentation gate: relative links and in-page anchors in Markdown must
  # resolve. Offline mode keeps the job deterministic (no network flakiness).
  links:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing below pushes
      - name: Install lychee
        # Pinned release, verified against the SHA-256 GitHub records for the
        # asset (lychee-action downloads it without a check).
        env:
          LYCHEE_VERSION: 0.24.2
          LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
        run: |
          mkdir -p "$RUNNER_TEMP/lychee" && cd "$RUNNER_TEMP/lychee"
          base="https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}"
          curl -fsSL --retry 3 -o lychee.tar.gz "${base}/lychee-x86_64-unknown-linux-gnu.tar.gz"
          echo "${LYCHEE_SHA256}  lychee.tar.gz" | sha256sum -c -
          tar -xzf lychee.tar.gz
          # The binary sits at the top level or in a lychee-* folder, by release.
          install -m 755 "$(find . -type f -name lychee | head -n 1)" "$RUNNER_TEMP/lychee-bin"
      - name: Check Markdown links
        run: |
          "$RUNNER_TEMP/lychee-bin" --offline --include-fragments --no-progress \
            './*.md' 'docs/**/*.md'

  # YAML and workflow gate: yamllint checks every YAML file (workflows, issue
  # forms) against .yamllint.yaml; actionlint type-checks workflows, including
  # their run scripts through the shellcheck that the runner image provides.
  lint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing below pushes
      - name: Install yamllint
        run: |
          python3 -m venv "$RUNNER_TEMP/lint-venv"
          "$RUNNER_TEMP/lint-venv/bin/pip" install --require-hashes \
            -r scripts/deps/requirements-lint.txt
      - name: yamllint
        run: |
          "$RUNNER_TEMP/lint-venv/bin/yamllint" --strict --format github .
      - name: Install actionlint
        # Pinned release, verified against the SHA-256 published with it.
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          curl -fsSL --retry 3 -o actionlint.tar.gz \
            "${base}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
      - name: actionlint
        run: |
          "$RUNNER_TEMP/actionlint" -color

  # Supply-chain gate: every deps.lock pin must still match what its URL
  # serves, including FetchContent fallbacks that the build jobs never fetch.
  deps-lock:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing below pushes
      - name: Verify every deps.lock entry
        run: scripts/deps/verify-lock.sh

  build-linux-gcc:
    runs-on: ubuntu-24.04 # the hashed Python wheels are for its CPython 3.12
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libavcodec-dev libavformat-dev \
            libavutil-dev libswscale-dev libswresample-dev \
            nlohmann-json3-dev libvips-dev libtesseract-dev tesseract-ocr-eng \
            libleptonica-dev libgtest-dev libbenchmark-dev python3-pip git wget ffmpeg
      - name: Install Python dependencies
        run: pip3 install --require-hashes -r scripts/deps/requirements-test-models.txt
      - name: Cache custom dependencies
        uses: actions/cache@v4
        with:
          path: |
            deps/whisper-build
            deps/whisper-src
            deps/onnxruntime-linux-x64-1.18.0
            deps/tesseract-5.5.2
            deps/leptonica-build
            deps/leptonica-1.87.0
            tests/models
            tests/data
          key: >-
            ${{ runner.os }}-deps-${{ hashFiles('deps.lock', 'scripts/ci-setup-deps.sh',
            'scripts/deps/**') }}
      - name: Setup custom dependencies
        run: scripts/ci-setup-deps.sh
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -DBUILD_BENCHMARKS=ON
      - name: Build
        run: cmake --build build --parallel "$(nproc)"
      - name: Test
        run: ctest --test-dir build --output-on-failure

  build-linux-clang:
    runs-on: ubuntu-24.04 # the hashed Python wheels are for its CPython 3.12
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libavcodec-dev libavformat-dev \
            libavutil-dev libswscale-dev libswresample-dev \
            nlohmann-json3-dev libvips-dev libtesseract-dev tesseract-ocr-eng \
            libleptonica-dev libgtest-dev libbenchmark-dev python3-pip git wget ffmpeg
      - name: Install Python dependencies
        run: pip3 install --require-hashes -r scripts/deps/requirements-test-models.txt
      - name: Cache custom dependencies
        uses: actions/cache@v4
        with:
          path: |
            deps/whisper-build
            deps/whisper-src
            deps/onnxruntime-linux-x64-1.18.0
            deps/tesseract-5.5.2
            deps/leptonica-build
            deps/leptonica-1.87.0
            tests/models
            tests/data
          key: >-
            ${{ runner.os }}-deps-${{ hashFiles('deps.lock', 'scripts/ci-setup-deps.sh',
            'scripts/deps/**') }}
      - name: Setup custom dependencies
        run: scripts/ci-setup-deps.sh
      - name: Configure
        run: >-
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
      - name: Build
        run: cmake --build build --parallel "$(nproc)"
      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitize:
    runs-on: ubuntu-24.04 # the hashed Python wheels are for its CPython 3.12
    env:
      ASAN_OPTIONS: detect_leaks=1
      LSAN_OPTIONS: suppressions=${{ github.workspace }}/scripts/asan.supp
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libavcodec-dev libavformat-dev \
            libavutil-dev libswscale-dev libswresample-dev \
            nlohmann-json3-dev libtesseract-dev tesseract-ocr-eng libleptonica-dev \
            libgtest-dev python3-pip git wget ffmpeg
      - name: Install Python dependencies
        run: pip3 install --require-hashes -r scripts/deps/requirements-test-models.txt
      - name: Cache custom dependencies
        uses: actions/cache@v4
        with:
          path: |
            deps/whisper-build
            deps/whisper-src
            deps/onnxruntime-linux-x64-1.18.0
            deps/tesseract-5.5.2
            deps/leptonica-build
            deps/leptonica-1.87.0
            tests/models
            tests/data
          key: >-
            ${{ runner.os }}-deps-${{ hashFiles('deps.lock', 'scripts/ci-setup-deps.sh',
            'scripts/deps/**') }}
      - name: Setup custom dependencies
        run: scripts/ci-setup-deps.sh
      - name: Configure ASan
        run: cmake -B build -DENABLE_ASAN=ON -DCMAKE_BUILD_TYPE=Debug -DBUILD_BENCHMARKS=OFF
      - name: Build ASan
        run: cmake --build build --parallel "$(nproc)"
      - name: Test ASan
        run: ctest --test-dir build --output-on-failure -E "sdk_consumer"
      - name: Configure UBSan
        run: cmake -B build_ub -DENABLE_UBSAN=ON -DCMAKE_BUILD_TYPE=Debug -DBUILD_BENCHMARKS=OFF
      - name: Build UBSan
        run: cmake --build build_ub --parallel "$(nproc)"
      - name: Test UBSan
        run: ctest --test-dir build_ub --output-on-failure -E "sdk_consumer"
