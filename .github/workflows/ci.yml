name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # Licensing gate: every file must declare its copyright and license
  # (SPDX headers, or REUSE.toml for files that cannot hold comments).
  reuse:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # third-party action below needs no token
      - name: REUSE compliance
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  # Documentation gate: relative links and in-page anchors in Markdown must
  # resolve. Offline mode keeps the job deterministic (no network flakiness).
  links:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # third-party action below needs no token
      - name: Check Markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --include-fragments --no-progress './*.md' 'docs/**/*.md'

  # YAML and workflow gate: yamllint checks every YAML file (workflows, issue
  # forms) against .yamllint.yaml; actionlint type-checks workflows, including
  # their run scripts through the shellcheck that the runner image provides.
  lint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing below pushes
      - name: yamllint
        run: pipx run --spec yamllint==1.38.0 yamllint --strict --format github .
      - name: Install actionlint
        # Pinned release, verified against the SHA-256 published with it.
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          curl -fsSL --retry 3 -o actionlint.tar.gz \
            "${base}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
      - name: actionlint
        run: |
          "$RUNNER_TEMP/actionlint" -color

  build-linux-gcc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libavcodec-dev libavformat-dev \
            libavutil-dev libswscale-dev libswresample-dev \
            nlohmann-json3-dev libvips-dev libtesseract-dev tesseract-ocr-eng \
            libleptonica-dev libgtest-dev libbenchmark-dev python3-pip git wget ffmpeg
      - name: Install Python dependencies
        run: pip3 install onnx numpy protobuf
      - name: Cache custom dependencies
        uses: actions/cache@v4
        with:
          path: |
            deps/whisper-build
            deps/whisper-src
            deps/onnxruntime-linux-x64-1.18.0
            deps/tesseract-5.5.2
            deps/leptonica-build
            deps/leptonica-1.87.0
            tests/models
            tests/data
          key: ${{ runner.os }}-deps-${{ hashFiles('scripts/ci-setup-deps.sh') }}
      - name: Setup custom dependencies
        run: scripts/ci-setup-deps.sh
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -DBUILD_BENCHMARKS=ON
      - name: Build
        run: cmake --build build --parallel $(nproc)
      - name: Test
        run: ctest --test-dir build --output-on-failure

  build-linux-clang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libavcodec-dev libavformat-dev \
            libavutil-dev libswscale-dev libswresample-dev \
            nlohmann-json3-dev libvips-dev libtesseract-dev tesseract-ocr-eng \
            libleptonica-dev libgtest-dev libbenchmark-dev python3-pip git wget ffmpeg
      - name: Install Python dependencies
        run: pip3 install onnx numpy protobuf
      - name: Cache custom dependencies
        uses: actions/cache@v4
        with:
          path: |
            deps/whisper-build
            deps/whisper-src
            deps/onnxruntime-linux-x64-1.18.0
            deps/tesseract-5.5.2
            deps/leptonica-build
            deps/leptonica-1.87.0
            tests/models
            tests/data
          key: ${{ runner.os }}-deps-${{ hashFiles('scripts/ci-setup-deps.sh') }}
      - name: Setup custom dependencies
        run: scripts/ci-setup-deps.sh
      - name: Configure
        run: >-
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
      - name: Build
        run: cmake --build build --parallel $(nproc)
      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitize:
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=1
      LSAN_OPTIONS: suppressions=${{ github.workspace }}/scripts/asan.supp
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libavcodec-dev libavformat-dev \
            libavutil-dev libswscale-dev libswresample-dev \
            nlohmann-json3-dev libtesseract-dev tesseract-ocr-eng libleptonica-dev \
            libgtest-dev python3-pip git wget ffmpeg
      - name: Install Python dependencies
        run: pip3 install onnx numpy protobuf
      - name: Cache custom dependencies
        uses: actions/cache@v4
        with:
          path: |
            deps/whisper-build
            deps/whisper-src
            deps/onnxruntime-linux-x64-1.18.0
            deps/tesseract-5.5.2
            deps/leptonica-build
            deps/leptonica-1.87.0
            tests/models
            tests/data
          key: ${{ runner.os }}-deps-${{ hashFiles('scripts/ci-setup-deps.sh') }}
      - name: Setup custom dependencies
        run: scripts/ci-setup-deps.sh
      - name: Configure ASan
        run: cmake -B build -DENABLE_ASAN=ON -DCMAKE_BUILD_TYPE=Debug -DBUILD_BENCHMARKS=OFF
      - name: Build ASan
        run: cmake --build build --parallel $(nproc)
      - name: Test ASan
        run: ctest --test-dir build --output-on-failure -E "sdk_consumer"
      - name: Configure UBSan
        run: cmake -B build_ub -DENABLE_UBSAN=ON -DCMAKE_BUILD_TYPE=Debug -DBUILD_BENCHMARKS=OFF
      - name: Build UBSan
        run: cmake --build build_ub --parallel $(nproc)
      - name: Test UBSan
        run: ctest --test-dir build_ub --output-on-failure -E "sdk_consumer"
