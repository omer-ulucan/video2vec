# Continuous integration for every pull request and every push to main, and a
# nightly run on main: licensing, documentation links, YAML and workflow lint,
# the deps.lock pins, and the build and test matrix.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Nightly: the same jobs, plus the ThreadSanitizer tests too slow for every
  # pull request (see the tsan leg). workflow_dispatch starts the same full
  # run by hand, on any branch.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# No token permissions unless a job asks for them.
permissions: {}

# A new push to a pull request cancels its older runs. Every other run (push,
# nightly, manual) gets a group of its own: GitHub keeps only one pending run
# per group, so a shared group for main would cancel queued pushes while the
# nightly run is going.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'pull_request'
    && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Licensing gate: every file must declare its copyright and license
  # (SPDX headers, or REUSE.toml for files that cannot hold comments).
  reuse:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing below pushes
      - name: REUSE compliance
        # The reuse image pinned by digest (tag 6.2.0): reuse-action builds from
        # the floating tag fsfe/reuse:6, which can change under the same pin.
        env:
          REUSE_DIGEST: sha256:85462a75c0f8efda09ddd190b92816b70e7662577c8427429e11e1b9f25a992e
        run: |
          docker run --rm --volume "$PWD:/data" --workdir /data --entrypoint sh \
            "fsfe/reuse:6.2.0@${REUSE_DIGEST}" \
            -c 'git config --global --add safe.directory /data && reuse lint'

  # Documentation gate: relative links and in-page anchors in Markdown must
  # resolve. Offline mode keeps the job deterministic (no network flakiness).
  links:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing below pushes
      - name: Install lychee
        # Pinned in deps.lock and checked by deps_unpack (lychee-action
        # downloads it without a check).
        run: |
          . scripts/deps/lock.sh
          deps_unpack lychee "$RUNNER_TEMP/downloads" "$RUNNER_TEMP/lychee"
          # Releases put the binary at the top level or in one lychee-* folder.
          bin="$RUNNER_TEMP/lychee/lychee"
          [[ -x "$bin" ]] || bin="$(echo "$RUNNER_TEMP"/lychee/lychee-*/lychee)"
          test -x "$bin"
          echo "LYCHEE=$bin" >> "$GITHUB_ENV"
      - name: Check Markdown links
        run: |
          "$LYCHEE" --offline --include-fragments --no-progress './*.md' 'docs/**/*.md'

  # YAML and workflow gate: yamllint checks every YAML file (workflows, issue
  # forms) against .yamllint.yaml; actionlint type-checks workflows, including
  # their run scripts through the shellcheck that the runner image provides.
  lint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing below pushes
      - name: Install yamllint
        run: |
          python3 -m venv "$RUNNER_TEMP/lint-venv"
          "$RUNNER_TEMP/lint-venv/bin/pip" install --require-hashes \
            -r scripts/deps/requirements-lint.txt
      - name: yamllint
        run: |
          "$RUNNER_TEMP/lint-venv/bin/yamllint" --strict --format github .
      - name: Install actionlint
        # Pinned in deps.lock and checked by deps_unpack.
        run: |
          . scripts/deps/lock.sh
          deps_unpack actionlint "$RUNNER_TEMP/downloads" "$RUNNER_TEMP/actionlint"
      - name: actionlint
        run: |
          "$RUNNER_TEMP/actionlint/actionlint" -color

  # Supply-chain gate: every deps.lock pin must still match what its URL
  # serves, including FetchContent fallbacks that the build jobs never fetch.
  deps-lock:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing below pushes
      - name: Verify every deps.lock entry
        run: scripts/deps/verify-lock.sh

  # Build and test matrix; every leg treats compiler warnings as errors.
  #   gcc, clang   Release builds running every test; gcc also proves that a
  #                corrupted download stops the dependency setup.
  #   asan-ubsan   AddressSanitizer and UndefinedBehaviorSanitizer, Debug.
  #   tsan         ThreadSanitizer, Debug.
  #   faiss        Release with FAISS built from its deps.lock pin, so the
  #                FAISS-backed index is compiled and tested as well.
  build:
    name: build (${{ matrix.name }})
    runs-on: ubuntu-24.04 # the hashed Python wheels are for its CPython 3.12
    timeout-minutes: 120 # the nightly TSan leg runs about an hour
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc
            cc: gcc
            cxx: g++
            cmake-args: -DCMAKE_BUILD_TYPE=Release
            check-setup: true
          - name: clang
            cc: clang
            cxx: clang++
            packages: clang
            cmake-args: -DCMAKE_BUILD_TYPE=Release
          - name: asan-ubsan
            cc: gcc
            cxx: g++
            cmake-args: >-
              -DCMAKE_BUILD_TYPE=Debug -DENABLE_ASAN=ON -DENABLE_UBSAN=ON
              -DBUILD_BENCHMARKS=OFF
            # The SDK consumer tests install and rebuild outside the sanitizer.
            ctest-args: -E ^sdk_consumer_
          - name: tsan
            # GCC, the compiler scripts/ci-setup-deps.sh builds the
            # instrumented whisper.cpp with, so one TSan runtime is linked.
            cc: gcc
            cxx: g++
            # whisper.cpp built with TSan in its own dependency tree.
            sanitize: thread
            deps-dir: deps/tsan
            cmake-args: -DCMAKE_BUILD_TYPE=Debug -DENABLE_TSAN=ON -DBUILD_BENCHMARKS=OFF
            # Whisper inference under TSan takes over 30 minutes, so pull
            # requests skip those three tests; the nightly run includes them.
            ctest-args: -E ^(sdk_consumer_.*|real_backends|e2e|cli_smoke)$
            ctest-args-nightly: -E ^sdk_consumer_
          - name: faiss
            cc: gcc
            cxx: g++
            packages: libopenblas-dev
            faiss: true
            # scripts/ci-setup-deps.sh installs FAISS under the deps directory.
            cmake-args: -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/deps/faiss-install"
    env:
      ASAN_OPTIONS: detect_leaks=1
      LSAN_OPTIONS: suppressions=${{ github.workspace }}/scripts/asan.supp
      UBSAN_OPTIONS: print_stacktrace=1
      TSAN_OPTIONS: >-
        second_deadlock_stack=1
        suppressions=${{ github.workspace }}/scripts/tsan.supp
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing below pushes
      - name: Set up build dependencies
        uses: ./.github/actions/build-deps
        with:
          extra-packages: ${{ matrix.packages }}
          faiss: ${{ matrix.faiss || false }}
          sanitize: ${{ matrix.sanitize }}
          deps-dir: ${{ matrix.deps-dir || 'deps' }}
      - name: A corrupted download stops the setup
        if: matrix.check-setup
        # Build-level proof behind deps.lock: with everything else in place, a
        # damaged copy of the cached whisper model must fail the setup.
        run: |
          model=tests/models/ggml-tiny.bin
          cp "$model" "$RUNNER_TEMP/model.bak"
          printf 'x' >> "$model"
          if scripts/ci-setup-deps.sh > "$RUNNER_TEMP/setup.log" 2>&1; then
            echo "the setup accepted a corrupted model"
            exit 1
          fi
          grep 'checksum mismatch' "$RUNNER_TEMP/setup.log"
          mv "$RUNNER_TEMP/model.bak" "$model"
      - name: Allow ThreadSanitizer's memory layout
        if: matrix.sanitize == 'thread'
        # Ubuntu 24.04 kernels randomize mmap addresses with 32 bits, which
        # ThreadSanitizer's fixed shadow layout rejects ("unexpected memory
        # mapping"); 28 bits is the value it supports.
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Restore the compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.name }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.name }}-
      - name: Configure
        run: >-
          cmake -B build ${{ matrix.cmake-args }} -DWARNINGS_AS_ERRORS=ON
          -DVIDEO2VEC_LOCAL_DEPS_DIR="$PWD/${{ matrix.deps-dir || 'deps' }}"
          -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: FAISS is used
        if: matrix.faiss
        # Without this the leg could silently build the exact-scan fallback.
        run: grep -q -- '-DHAS_FAISS=1' build/compile_commands.json
      - name: Build
        # Statistics are zeroed first so the last step shows this run's hit rate.
        run: |
          ccache --zero-stats
          cmake --build build --parallel "$(nproc)"
      - name: Test
        env:
          CTEST_ARGS: >-
            ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
            && matrix.ctest-args-nightly || matrix.ctest-args }}
        # CTEST_ARGS is a word list (options and a regex without spaces), so it
        # is split on purpose; set -f keeps the regex from being globbed.
        run: |
          set -f
          # shellcheck disable=SC2086
          ctest --test-dir build --output-on-failure ${CTEST_ARGS}
      - name: Compiler cache statistics
        run: ccache --show-stats

